<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
     Политика доступа к системной шине D-Bus для сервиса cert-helper.
     Устанавливается в /etc/dbus-1/system.d/org.certhelper.CertHelper1.conf
     (загружается системным dbus-daemon при старте/reload — на большинстве
     дистрибутивов достаточно `systemctl reload dbus` или перезапуска
     dbus-daemon, изменение не требует рестарта самого cert-helper).

     ЗАМЕНЯЕТ прежнюю модель контроля доступа UDS-версии демона (права
     0660 на файл сокета + выделенная группа-владелец). При переходе на
     D-Bus контроль доступа переносится сюда: "кто имеет право владеть
     well-known именем" и "кто имеет право слать вызовы методов на это
     имя/интерфейс" — концептуально тот же принцип (выделенная группа для
     клиентов, отдельный пользователь для самого демона), просто
     выраженный в терминах D-Bus policy, а не файловых прав.
-->
<busconfig>
  <!-- Только пользователь, под которым запущен сам демон (см.
       deploy/cert-helper.service: User=cert-helper), может зарегистрировать
       (own) well-known имя org.certhelper.CertHelper1. Любой другой
       процесс, попытавшийся запросить это имя, получит отказ — это не даёт
       постороннему процессу подменить собой демон на шине. -->
  <policy user="cert-helper">
    <allow own="org.certhelper.CertHelper1"/>
  </policy>

  <!-- Группа-клиент: процессы, которым разрешено вызывать методы демона
       (аналог "группа-владелец файла сокета" из UDS-модели). NGFW-процесс
       должен быть добавлен в группу cert-helper-clients (аналогично тому,
       как раньше он должен был состоять в группе-владельце UDS-сокета). -->
  <policy group="cert-helper-clients">
    <allow send_destination="org.certhelper.CertHelper1"
           send_interface="org.certhelper.CertHelper1"
           send_type="method_call"/>
    <!-- Разрешаем получать ответы/сигналы обратно от демона. -->
    <allow receive_sender="org.certhelper.CertHelper1"/>
  </policy>

  <!-- root — обычная практика для системной шины (администратор/отладка),
       не является ослаблением модели угроз: root и так может всё. -->
  <policy user="root">
    <allow send_destination="org.certhelper.CertHelper1"/>
    <allow receive_sender="org.certhelper.CertHelper1"/>
  </policy>

  <!-- Всем остальным — запрет по умолчанию на обращение к этому имени.
       Явный <deny> продублирован (а не оставлен "просто отсутствием
       <allow>") ради читаемости политики при аудите: явное перечисление
       "кто не может" рядом с "кто может" снижает риск, что кто-то добавит
       ещё одну секцию <policy context="default"> с более широким allow
       где-то в другом файле и случайно перекроет умолчание. -->
  <policy context="default">
    <deny send_destination="org.certhelper.CertHelper1"/>
  </policy>
</busconfig>
